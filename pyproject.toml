[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-verbs"
version = "0.1.0"
description = "Write what you want done as one Python file of verbs; run it once; read one report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
claude-verbs = "claude_verbs.cli:main"

[tool.setuptools]
packages = ["claude_verbs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
